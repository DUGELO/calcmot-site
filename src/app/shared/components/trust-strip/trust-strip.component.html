<div class="trust">
  <ul class="pill-row">
    @for (item of items(); track item) {
      <li class="pill pill--guardrail">{{ item }}</li>
    }
  </ul>

  @if (disclaimer()) {
    <p class="trust__disclaimer">{{ disclaimer() }}</p>
  }

  @if (linkLabel() && linkHref()) {
    <a class="link-more" [href]="linkHref()">
      {{ linkLabel() }}
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3 8h9M9 4l4 4-4 4" /></svg>
    </a>
  }
</div>
