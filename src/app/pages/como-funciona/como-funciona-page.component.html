<app-page-hero
  [eyebrow]="page.hero.eyebrow"
  [title]="page.hero.title"
  [lead]="page.hero.lead"
  [points]="page.hero.points ?? []"
>
  <div class="como-funciona__actions">
    <app-cta-button label="Baixar na Play Store" [href]="playStoreUrl" [external]="true" />
    <app-cta-button
      label="Ver a calculadora de ganhos"
      href="/calculadora-ganhos-motorista-app"
      variant="secondary"
    />
  </div>
</app-page-hero>

@for (section of page.sections; track section.id) {
  <app-page-section [section]="section" />
}

<app-cta-band
  [title]="page.closing.title"
  [description]="page.closing.description"
  [secondaryLabel]="copy.finalCta.secondaryLabel"
  [secondaryHref]="copy.finalCta.secondaryHref"
/>
