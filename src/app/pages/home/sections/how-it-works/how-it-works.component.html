<section id="como-funciona" class="timeline section section--surface" aria-labelledby="passos-titulo">
  <div class="container">
    <div class="section-heading">
      <p class="eyebrow">{{ copy.timeline.eyebrow }}</p>
      <h2 id="passos-titulo">{{ copy.timeline.title }}</h2>
      <p>{{ copy.timeline.description }}</p>
    </div>

    <ol class="timeline__list">
      @for (step of copy.timeline.steps; track step.number) {
        <li class="timeline__step">
          <span class="timeline__number" aria-hidden="true">{{ step.number }}</span>
          <h3>{{ step.title }}</h3>
          <p>{{ step.detail }}</p>
        </li>
      }
    </ol>

    <a class="link-more" [href]="copy.timeline.linkHref">
      {{ copy.timeline.linkLabel }}
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M3 8h9M9 4l4 4-4 4" /></svg>
    </a>
  </div>
</section>
