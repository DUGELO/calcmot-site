<section class="section" aria-labelledby="overlay-title">
  <div class="container overlay-demo">
    <div class="section-heading overlay-demo__copy">
      <p class="eyebrow">{{ copy.eyebrow }}</p>
      <h2 id="overlay-title">{{ copy.title }}</h2>
      <p>{{ copy.description }}</p>
      <div class="metric-language" aria-label="Métricas mostradas pelo CalcMot">
        <span>R$/km</span>
        <span>R$/h</span>
        <span>Tempo</span>
        <span class="metric-language__great">ÓTIMA</span>
      </div>
      <div class="overlay-demo__readout" aria-label="Resumo da leitura do CalcMot">
        <div>
          <span>Sua meta</span>
          <strong>R$ 2,00/km</strong>
        </div>
        <div>
          <span>Leitura</span>
          <strong>oferta visível</strong>
        </div>
        <div>
          <span>Controle</span>
          <strong>seu</strong>
        </div>
      </div>
    </div>

    <app-phone-mockup />
  </div>
</section>
