name: Site CI (Angular + SEO)

on:
  pull_request:
    branches: [main, feat/site-ci-growth-prd]
  push:
    branches: [main]
  workflow_dispatch:

# O deploy continua exclusivamente na integração GitHub -> Cloudflare.
# Este workflow apenas valida código, build e HTML indexável.
permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: QA estático, build e prerender
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      NODE_OPTIONS: --max-old-space-size=4096
      CF_PREVIEW_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_PREVIEW_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js do projeto
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências do lockfile
        run: npm ci --no-audit --no-fund

      - name: Guardrails do site
        run: npm run qa:static

      - name: Testar motor financeiro
        run: npm run test:calculator

      - name: Testar atribuição de conversões sem PII
        run: npm run test:analytics

      - name: Build Angular SSR + prerender
        run: npm run build

      - name: Validar HTML indexável, canonical, Play Store e sitemap
        run: node scripts/verify-prerender.mjs

      # Downloadable preview for EVERY PR, even before hosting credentials are configured.
      - name: Publicar build HTML como artifact de preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: calcmot-preview-pr-${{ github.event.pull_request.number }}
          path: dist/calcmot-site/browser
          if-no-files-found: error
          retention-days: 7

      # Optional real URL; isolated Pages project, NEVER production Worker.
      - name: Deploy preview isolado no Cloudflare Pages
        if: github.event_name == 'pull_request' && env.CF_PREVIEW_TOKEN != '' && env.CF_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_PREVIEW_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/calcmot-site/browser --project-name=calcmot-site-preview --branch=pr-${{ github.event.pull_request.number }}

      - name: Orientar quando preview hospedado nao estiver configurado
        if: github.event_name == 'pull_request' && (env.CF_PREVIEW_TOKEN == '' || env.CF_ACCOUNT_ID == '')
        run: echo "Preview HTML disponivel em Artifacts. Para URL publica, configurar Cloudflare Pages staging e secrets conforme docs/deploy/preview.md."
