name: Site CI (Angular + SEO)

on:
  pull_request:
    branches: [main, feat/site-ci-growth-prd]
  push:
    branches: [main]
  workflow_dispatch:

# O deploy continua exclusivamente na integração GitHub -> Cloudflare.
# Este workflow apenas valida código, build e HTML indexável.
permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: QA estático, build e prerender
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js do projeto
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências do lockfile
        run: npm ci --no-audit --no-fund

      - name: Guardrails do site
        run: npm run qa:static

      - name: Guardrails e testes administrativos isolados
        run: |
          npm run qa:admin
          npm run test:admin
          npm run test:admin:edge

      - name: Testar motor financeiro
        run: npm run test:calculator

      - name: Testar atribuição de conversões sem PII
        run: npm run test:analytics

      - name: Build Angular SSR + prerender
        run: npm run build

      - name: Validar HTML indexável, canonical, Play Store e sitemap
        run: node scripts/verify-prerender.mjs

      - name: Empacotar o Worker e Assets sem publicar
        run: npx wrangler deploy --dry-run --config wrangler.jsonc --outdir .angular/worker-dryrun

      - name: Conferir paridade SSR/SSG público e shell administrativo
        run: node scripts/verify-admin-build.mjs dist/calcmot-cloudflare/browser dist/calcmot-site/browser

      - name: Testar roteamento no workerd local sem API remota
        env:
          # Pinned local runtime supports up to this date. Production retains
          # the existing 2026-10-19 date; Google/CSP E2E follows deployment.
          ADMIN_WORKER_TEST_DATE: "2026-10-13"
        run: node scripts/verify-admin-workerd.mjs

      - name: Preparar Chromium para smoke test mobile
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium

      - name: Smoke test E2E Angular mobile-first
        run: python scripts/e2e-mobile-smoke.py

      - name: Validar eventos GA4 com hostname de produção simulado
        run: python scripts/e2e-analytics-production.py

      # Downloadable preview for EVERY PR, even before hosting credentials are configured.
      - name: Publicar build HTML como artifact de preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: calcmot-preview-pr-${{ github.event.pull_request.number }}
          path: dist/calcmot-site/browser
          if-no-files-found: error
          retention-days: 7

      # Production deploy remains exclusively GitHub main -> existing
      # Cloudflare Worker Builds. No parallel Pages deployment from this workflow.
