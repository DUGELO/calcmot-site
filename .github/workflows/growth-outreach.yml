name: CalcMot bounded growth cycle
on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'
  pull_request:
    paths:
      - '.github/workflows/growth-outreach.yml'
      - 'scripts/growth/**'
      - 'scripts/growth-*.mjs'
      - 'tests/growth/**'
      - 'docs/growth/prospects.json'
      - 'docs/growth/execution-log.json'
      - 'docs/growth/data/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: growth-outreach-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  bounded-cycle:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/growth/*.test.mjs
      - name: Recovery - find trusted checkpoint on this workflow and branch
        id: recover
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request?.head.ref || context.ref.replace('refs/heads/', '');
            const repoName = context.repo.owner + '/' + context.repo.repo;
            let response;
            try { response = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'growth-outreach.yml', branch, status: 'completed', per_page: 5
            }); } catch (error) {
              if (error.status === 404) { core.info('Workflow not registered on default branch yet; seed from versioned state.'); return; }
              throw error;
            }
            for (const run of response.data.workflow_runs) {
              if (run.id === context.runId || run.head_repository?.full_name !== repoName || run.head_branch !== branch) continue;
              const listed = await github.rest.actions.listWorkflowRunArtifacts({...context.repo, run_id: run.id, per_page: 10});
              const artifact = listed.data.artifacts.find(a => a.name === 'growth-persistent-state' && !a.expired && a.size_in_bytes < 5000000);
              if (artifact) { core.setOutput('run-id', String(run.id)); return; }
            }
            core.info('No trusted branch checkpoint; seed from versioned inventory and ledger.');
      - name: Recovery - download prior checkpoint
        if: steps.recover.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.recover.outputs.run-id }}
          name: growth-persistent-state
          path: prior-checkpoint
      - name: Discovery, Qualification, Execution queue, Verification and Reporting
        run: node scripts/growth/cycle.mjs docs/growth/prospects.json prior-checkpoint/growth-state.json growth-state.json growth-outreach-report.md
      - name: Persist checkpoint even if a task failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-persistent-state
          retention-days: 90
          if-no-files-found: warn
          path: |
            growth-state.json
            growth-outreach-report.md
            growth-outreach-report.json
